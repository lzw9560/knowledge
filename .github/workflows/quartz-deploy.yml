name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '.quartz/package-lock.json'

      - name: Install dependencies
        working-directory: .quartz
        run: npm ci

      - name: Resolve plugins
        working-directory: .quartz
        run: npm run install-plugins
        continue-on-error: true

      - name: Build Quartz
        working-directory: .quartz
        run: npx quartz build -d .. -o public

      - name: Add .nojekyll and index redirect
        run: |
          touch .quartz/public/.nojekyll
          # Quartz 不生成根 index.html（首页是 🏠-首页.html），加重定向
          cat > .quartz/public/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=🏠-首页">
          <title>投研知识图谱</title>
          <script>window.location.href='🏠-首页';</script>
          </head>
          <body>
          <p>跳转中... <a href="🏠-首页">投研知识图谱</a></p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
